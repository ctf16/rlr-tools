<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rlr-tools</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --text: #eee;
    --muted: #888;
    --border: #333;
    --success: #4ade80;
    --warn: #fbbf24;
    --sidebar-width: 280px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
  #sidebar {
    width: var(--sidebar-width);
    min-width: 180px;
    max-width: 50vw;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }
  #sidebar h1 {
    padding: 16px;
    font-size: 18px;
    border-bottom: 1px solid var(--border);
    color: var(--accent);
    flex-shrink: 0;
  }
  #replay-list {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
  }
  .category { padding: 8px 0; }
  .category-header {
    padding: 6px 16px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .replay-item {
    padding: 8px 16px 8px 24px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .replay-item:hover { background: var(--surface2); }
  .replay-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }
  .cached-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .cached-dot.yes { background: var(--success); }
  .cached-dot.no { background: var(--border); }

  /* Upload */
  #upload-section {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #upload-section label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    display: block;
    margin-bottom: 8px;
  }
  #upload-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  #upload-form input[type="file"] {
    flex: 1 1 100px;
    min-width: 0;
    font-size: 12px;
    color: var(--muted);
  }
  #upload-form button {
    padding: 4px 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Resize handle */
  #resize-handle {
    width: 5px;
    cursor: col-resize;
    background: transparent;
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    transition: background 0.15s;
  }
  #resize-handle:hover,
  #resize-handle.dragging {
    background: var(--accent);
  }

  /* Main */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  #toolbar {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    background: var(--surface);
    flex-shrink: 0;
  }
  #toolbar button {
    padding: 6px 14px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  #toolbar button:hover { background: var(--accent); border-color: var(--accent); }
  #toolbar button.active { background: var(--accent); border-color: var(--accent); }

  #content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    min-height: 0;
  }
  #placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 16px;
    text-align: center;
    padding: 20px;
  }
  pre {
    background: var(--surface);
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .loading { color: var(--muted); font-style: italic; }
  .error { color: var(--accent); }

  /* Summary cards */
  .card {
    background: var(--surface);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h3 {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .card pre { background: var(--surface2); margin: 0; }

  /* Mobile: collapse sidebar behind a toggle */
  #sidebar-toggle {
    display: none;
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 100;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 14px;
  }

  @media (max-width: 640px) {
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 50;
      width: 280px;
      max-width: 85vw;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }
    #sidebar.open {
      transform: translateX(0);
    }
    #sidebar-toggle {
      display: block;
    }
    #sidebar.open ~ #sidebar-toggle {
      left: calc(280px + 12px);
    }
    #resize-handle {
      display: none;
    }
    #main {
      width: 100%;
    }
    #toolbar {
      padding: 12px 12px 12px 56px;
    }
    #content {
      padding: 16px;
    }
    /* Overlay backdrop when sidebar open */
    #sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 40;
    }
    #sidebar.open ~ #sidebar-backdrop {
      display: block;
    }
  }
</style>
</head>
<body>
  <button id="sidebar-toggle" aria-label="Toggle sidebar">&#9776;</button>
  <div id="sidebar">
    <h1>rlr-tools</h1>
    <div id="upload-section">
      <label>Upload Replay</label>
      <form id="upload-form">
        <input type="file" name="replay" accept=".replay">
        <button type="submit">Upload</button>
      </form>
    </div>
    <div id="replay-list"></div>
    <div id="resize-handle"></div>
  </div>
  <div id="sidebar-backdrop"></div>
  <div id="main">
    <div id="toolbar" style="display:none">
      <button data-action="overview" class="active">Overview</button>
      <button data-action="players">Players</button>
      <button data-action="stats">Stats</button>
      <button data-action="bot-detection">Bot Detection</button>
      <button data-action="kickoff">Kickoff</button>
      <button data-action="boost">Boost</button>
      <button data-action="rotation">Rotation</button>
      <button data-action="dribble">Dribble</button>
      <button data-action="sign">Sign</button>
      <button data-action="verify">Verify</button>
    </div>
    <div id="content">
      <div id="placeholder">Select a replay from the sidebar to begin</div>
    </div>
  </div>

<script>
const API = '/api';
let currentReplay = null;

// ── Sidebar resize ────────────────────────────────────────────────────

(function initResize() {
  const handle = document.getElementById('resize-handle');
  const sidebar = document.getElementById('sidebar');
  let startX, startWidth;

  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    startX = e.clientX;
    startWidth = sidebar.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', onStop);
  });

  function onDrag(e) {
    const newWidth = Math.min(
      Math.max(startWidth + (e.clientX - startX), 180),
      window.innerWidth * 0.5
    );
    sidebar.style.width = newWidth + 'px';
  }

  function onStop() {
    handle.classList.remove('dragging');
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', onStop);
  }

  // Touch support for resize handle
  handle.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    startX = touch.clientX;
    startWidth = sidebar.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.addEventListener('touchmove', onTouchDrag);
    document.addEventListener('touchend', onTouchStop);
  });

  function onTouchDrag(e) {
    const touch = e.touches[0];
    const newWidth = Math.min(
      Math.max(startWidth + (touch.clientX - startX), 180),
      window.innerWidth * 0.5
    );
    sidebar.style.width = newWidth + 'px';
  }

  function onTouchStop() {
    handle.classList.remove('dragging');
    document.removeEventListener('touchmove', onTouchDrag);
    document.removeEventListener('touchend', onTouchStop);
  }
})();

// ── Mobile sidebar toggle ─────────────────────────────────────────────

document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

document.getElementById('sidebar-backdrop').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
});

// ── Sidebar ───────────────────────────────────────────────────────────

async function loadReplays() {
  const res = await fetch(`${API}/replays`);
  const data = await res.json();
  const container = document.getElementById('replay-list');
  container.innerHTML = '';

  for (const cat of data.categories) {
    const div = document.createElement('div');
    div.className = 'category';
    div.innerHTML = `<div class="category-header">${cat.name} (${cat.replay_count})</div>`;
    for (const r of cat.replays) {
      const item = document.createElement('div');
      item.className = 'replay-item';
      item.dataset.category = cat.name;
      item.dataset.name = r.name;
      item.innerHTML = `<span class="cached-dot ${r.cached ? 'yes' : 'no'}"></span><span style="overflow:hidden;text-overflow:ellipsis">${r.name}</span>`;
      item.onclick = () => selectReplay(cat.name, r.name);
      div.appendChild(item);
    }
    container.appendChild(div);
  }
}

function selectReplay(category, name) {
  currentReplay = { category, name };

  document.querySelectorAll('.replay-item').forEach(el => {
    el.classList.toggle('active', el.dataset.category === category && el.dataset.name === name);
  });

  // Close mobile sidebar on selection
  document.getElementById('sidebar').classList.remove('open');

  document.getElementById('toolbar').style.display = 'flex';
  loadAction('overview');

  document.querySelectorAll('#toolbar button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.action === 'overview');
  });
}

// ── Toolbar ───────────────────────────────────────────────────────────

document.getElementById('toolbar').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadAction(btn.dataset.action);
});

async function loadAction(action) {
  if (!currentReplay) return;
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading...</div>';

  const { category, name } = currentReplay;
  const method = action === 'sign' ? 'POST' : 'GET';

  try {
    const res = await fetch(`${API}/replays/${category}/${name}/${action}`, { method });
    const data = await res.json();

    if (!res.ok) {
      content.innerHTML = `<div class="error">Error: ${data.error || res.statusText}</div>`;
      return;
    }

    content.innerHTML = `<div class="card"><h3>${action}</h3><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
  } catch (e) {
    content.innerHTML = `<div class="error">Request failed: ${e.message}</div>`;
  }
}

// ── Upload ────────────────────────────────────────────────────────────

document.getElementById('upload-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = e.target.querySelector('input[type="file"]');
  if (!input.files.length) return;

  const form = new FormData();
  form.append('replay', input.files[0]);

  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Uploading and parsing...</div>';

  try {
    const res = await fetch(`${API}/replays/upload`, { method: 'POST', body: form });
    const data = await res.json();

    if (!res.ok) {
      content.innerHTML = `<div class="error">Upload error: ${data.error || res.statusText}</div>`;
      return;
    }

    content.innerHTML = `<div class="card"><h3>Upload Complete</h3><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
    input.value = '';
    await loadReplays();
    selectReplay(data.category, data.name);
  } catch (e) {
    content.innerHTML = `<div class="error">Upload failed: ${e.message}</div>`;
  }
});

// ── Init ──────────────────────────────────────────────────────────────

loadReplays();
</script>
</body>
</html>
