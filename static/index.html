<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rlr-tools</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --text: #eee;
    --muted: #888;
    --border: #333;
    --success: #4ade80;
    --warn: #fbbf24;
    --sidebar-width: 280px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
  #sidebar {
    width: var(--sidebar-width);
    min-width: 180px;
    max-width: 50vw;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }
  #sidebar h1 {
    padding: 16px;
    font-size: 18px;
    border-bottom: 1px solid var(--border);
    color: var(--accent);
    flex-shrink: 0;
  }
  #replay-list {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
  }
  .category { padding: 8px 0; }
  .category-header {
    padding: 6px 16px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .replay-item {
    padding: 8px 16px 8px 24px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .replay-item:hover { background: var(--surface2); }
  .replay-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }
  .cached-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .cached-dot.yes { background: var(--success); }
  .cached-dot.no { background: var(--border); }

  /* Upload */
  #upload-section {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #upload-section label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    display: block;
    margin-bottom: 8px;
  }
  #upload-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  #upload-form input[type="file"] {
    flex: 1 1 100px;
    min-width: 0;
    font-size: 12px;
    color: var(--muted);
  }
  #upload-form button {
    padding: 4px 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Resize handle */
  #resize-handle {
    width: 5px;
    cursor: col-resize;
    background: transparent;
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    transition: background 0.15s;
  }
  #resize-handle:hover,
  #resize-handle.dragging {
    background: var(--accent);
  }

  /* Main */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  #toolbar {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    background: var(--surface);
    flex-shrink: 0;
  }
  #toolbar button {
    padding: 6px 14px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  #toolbar button:hover { background: var(--accent); border-color: var(--accent); }
  #toolbar button.active { background: var(--accent); border-color: var(--accent); }

  #content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    min-height: 0;
  }
  #placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 16px;
    text-align: center;
    padding: 20px;
  }
  pre {
    background: var(--surface);
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .loading { color: var(--muted); font-style: italic; }
  .error { color: var(--accent); }

  /* Summary cards */
  .card {
    background: var(--surface);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h3 {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .card pre { background: var(--surface2); margin: 0; }

  /* Formatted views */
  .kv-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 16px;
    font-size: 14px;
  }
  .kv-grid .label { color: var(--muted); text-align: right; }
  .kv-grid .value { font-weight: 600; }

  .score-display {
    font-size: 28px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .score-display .blue { color: #4a9eff; }
  .score-display .orange { color: #ff8c42; }
  .score-display .sep { color: var(--muted); font-weight: 400; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-green { background: rgba(74,222,128,0.15); color: var(--success); }
  .badge-red { background: rgba(233,69,96,0.15); color: var(--accent); }
  .badge-yellow { background: rgba(251,191,36,0.15); color: var(--warn); }
  .badge-muted { background: rgba(136,136,136,0.15); color: var(--muted); }

  .team-panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 640px) {
    .team-panels { grid-template-columns: 1fr; }
  }
  .team-panel {
    background: var(--surface2);
    border-radius: 8px;
    padding: 12px 16px;
  }
  .team-panel h4 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 2px solid;
  }
  .team-panel.blue h4 { color: #4a9eff; border-color: #4a9eff; }
  .team-panel.orange h4 { color: #ff8c42; border-color: #ff8c42; }

  .player-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 14px;
  }
  .player-row .platform {
    font-size: 11px;
    color: var(--muted);
    background: var(--surface);
    padding: 1px 6px;
    border-radius: 3px;
  }
  .bot-dot {
    width: 6px; height: 6px; border-radius: 50%;
    flex-shrink: 0;
  }
  .bot-dot.is-bot { background: var(--accent); }
  .bot-dot.human { background: var(--success); }

  /* Data tables */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .data-table th {
    text-align: left;
    padding: 8px 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .data-table th.num, .data-table td.num { text-align: right; }
  .data-table td {
    padding: 6px 10px;
    border-bottom: 1px solid rgba(51,51,51,0.5);
  }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: rgba(15,52,96,0.3); }

  /* Progress bars */
  .progress-bar {
    width: 80px;
    height: 8px;
    background: var(--surface);
    border-radius: 4px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }
  .progress-bar .fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .progress-inline {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  /* Stat highlight */
  .stat-best { color: var(--success); font-weight: 600; }

  /* Verify/Sign status */
  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 14px;
  }
  .status-icon { font-size: 18px; }
  .hash-display {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px;
    color: var(--muted);
    background: var(--surface2);
    padding: 4px 8px;
    border-radius: 4px;
    word-break: break-all;
  }
  .leaves-list {
    max-height: 200px;
    overflow-y: auto;
    margin-top: 8px;
  }
  .leaf-item {
    display: flex;
    gap: 8px;
    padding: 3px 0;
    font-size: 12px;
  }
  .leaf-item .leaf-label { color: var(--muted); min-width: 120px; }
  .leaf-item .leaf-hash { font-family: monospace; color: var(--text); opacity: 0.7; }

  .double-commit-event {
    background: var(--surface);
    border-radius: 6px;
    padding: 8px 12px;
    margin-top: 6px;
    font-size: 13px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .double-commit-event .dc-label { color: var(--muted); }

  .card-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card-row .card { flex: 1; min-width: 200px; }
  .stat-big {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
  }

  /* Mobile: collapse sidebar behind a toggle */
  #sidebar-toggle {
    display: none;
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 100;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 14px;
  }

  @media (max-width: 640px) {
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 50;
      width: 280px;
      max-width: 85vw;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }
    #sidebar.open {
      transform: translateX(0);
    }
    #sidebar-toggle {
      display: block;
    }
    #sidebar.open ~ #sidebar-toggle {
      left: calc(280px + 12px);
    }
    #resize-handle {
      display: none;
    }
    #main {
      width: 100%;
    }
    #toolbar {
      padding: 12px 12px 12px 56px;
    }
    #content {
      padding: 16px;
    }
    /* Overlay backdrop when sidebar open */
    #sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 40;
    }
    #sidebar.open ~ #sidebar-backdrop {
      display: block;
    }
  }
</style>
</head>
<body>
  <button id="sidebar-toggle" aria-label="Toggle sidebar">&#9776;</button>
  <div id="sidebar">
    <h1>rlr-tools</h1>
    <div id="upload-section">
      <label>Upload Replay</label>
      <form id="upload-form">
        <input type="file" name="replay" accept=".replay">
        <button type="submit">Upload</button>
      </form>
    </div>
    <div id="replay-list"></div>
    <div id="resize-handle"></div>
  </div>
  <div id="sidebar-backdrop"></div>
  <div id="main">
    <div id="toolbar" style="display:none">
      <button data-action="overview" class="active">Overview</button>
      <button data-action="players">Players</button>
      <button data-action="stats">Stats</button>
      <button data-action="bot-detection">Bot Detection</button>
      <button data-action="kickoff">Kickoff</button>
      <button data-action="boost">Boost</button>
      <button data-action="rotation">Rotation</button>
      <button data-action="dribble">Dribble</button>
      <button data-action="sign">Sign</button>
      <button data-action="verify">Verify</button>
    </div>
    <div id="content">
      <div id="placeholder">Select a replay from the sidebar to begin</div>
    </div>
  </div>

<script>
const API = '/api';
let currentReplay = null;

// ── Sidebar resize ────────────────────────────────────────────────────

(function initResize() {
  const handle = document.getElementById('resize-handle');
  const sidebar = document.getElementById('sidebar');
  let startX, startWidth;

  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    startX = e.clientX;
    startWidth = sidebar.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', onStop);
  });

  function onDrag(e) {
    const newWidth = Math.min(
      Math.max(startWidth + (e.clientX - startX), 180),
      window.innerWidth * 0.5
    );
    sidebar.style.width = newWidth + 'px';
  }

  function onStop() {
    handle.classList.remove('dragging');
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', onStop);
  }

  // Touch support for resize handle
  handle.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    startX = touch.clientX;
    startWidth = sidebar.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.addEventListener('touchmove', onTouchDrag);
    document.addEventListener('touchend', onTouchStop);
  });

  function onTouchDrag(e) {
    const touch = e.touches[0];
    const newWidth = Math.min(
      Math.max(startWidth + (touch.clientX - startX), 180),
      window.innerWidth * 0.5
    );
    sidebar.style.width = newWidth + 'px';
  }

  function onTouchStop() {
    handle.classList.remove('dragging');
    document.removeEventListener('touchmove', onTouchDrag);
    document.removeEventListener('touchend', onTouchStop);
  }
})();

// ── Mobile sidebar toggle ─────────────────────────────────────────────

document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

document.getElementById('sidebar-backdrop').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
});

// ── Sidebar ───────────────────────────────────────────────────────────

async function loadReplays() {
  const res = await fetch(`${API}/replays`);
  const data = await res.json();
  const container = document.getElementById('replay-list');
  container.innerHTML = '';

  for (const cat of data.categories) {
    const div = document.createElement('div');
    div.className = 'category';
    div.innerHTML = `<div class="category-header">${cat.name} (${cat.replay_count})</div>`;
    for (const r of cat.replays) {
      const item = document.createElement('div');
      item.className = 'replay-item';
      item.dataset.category = cat.name;
      item.dataset.name = r.name;
      item.innerHTML = `<span class="cached-dot ${r.cached ? 'yes' : 'no'}"></span><span style="overflow:hidden;text-overflow:ellipsis">${r.name}</span>`;
      item.onclick = () => selectReplay(cat.name, r.name);
      div.appendChild(item);
    }
    container.appendChild(div);
  }
}

function selectReplay(category, name) {
  currentReplay = { category, name };

  document.querySelectorAll('.replay-item').forEach(el => {
    el.classList.toggle('active', el.dataset.category === category && el.dataset.name === name);
  });

  // Close mobile sidebar on selection
  document.getElementById('sidebar').classList.remove('open');

  document.getElementById('toolbar').style.display = 'flex';
  loadAction('overview');

  document.querySelectorAll('#toolbar button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.action === 'overview');
  });
}

// ── Toolbar ───────────────────────────────────────────────────────────

document.getElementById('toolbar').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadAction(btn.dataset.action);
});

async function loadAction(action) {
  if (!currentReplay) return;
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading...</div>';

  const { category, name } = currentReplay;
  const method = action === 'sign' ? 'POST' : 'GET';

  try {
    const res = await fetch(`${API}/replays/${category}/${name}/${action}`, { method });
    const data = await res.json();

    if (!res.ok) {
      content.innerHTML = `<div class="error">Error: ${data.error || res.statusText}</div>`;
      return;
    }

    const renderer = renderers[action];
    if (renderer) {
      content.innerHTML = renderer(data);
    } else {
      content.innerHTML = `<div class="card"><h3>${action}</h3><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
    }
  } catch (e) {
    content.innerHTML = `<div class="error">Request failed: ${e.message}</div>`;
  }
}

// ── Helpers ──────────────────────────────────────────────────────────

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function fmtDuration(secs) {
  if (secs == null) return '—';
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function fmtNum(v, decimals = 1) {
  if (v == null) return '—';
  return typeof v === 'number' ? v.toFixed(decimals) : String(v);
}

function fmtInt(v) {
  if (v == null) return '—';
  return String(Math.round(v));
}

function scoreColor(v, max) {
  // 0 = green, 1 = red
  const t = Math.min(v / Math.max(max, 0.01), 1);
  if (t < 0.3) return 'var(--success)';
  if (t < 0.6) return 'var(--warn)';
  return 'var(--accent)';
}

function progressBar(value, max, color) {
  const pct = Math.min((value / Math.max(max, 0.01)) * 100, 100);
  const c = color || scoreColor(value, max);
  return `<span class="progress-inline"><span class="progress-bar"><span class="fill" style="width:${pct}%;background:${c}"></span></span>${fmtNum(value, 2)}</span>`;
}

function verdictBadge(verdict) {
  if (!verdict) return '';
  const cls = verdict === 'Human' ? 'badge-green' : verdict === 'Bot' ? 'badge-red' : 'badge-yellow';
  return `<span class="badge ${cls}">${esc(verdict)}</span>`;
}

function teamClass(idx) { return idx === 0 ? 'blue' : 'orange'; }
function teamName(idx) { return idx === 0 ? 'Blue' : 'Orange'; }

function tableHeader(cols) {
  return '<thead><tr>' + cols.map(c => {
    const cls = c.num ? ' class="num"' : '';
    return `<th${cls}>${esc(c.label)}</th>`;
  }).join('') + '</tr></thead>';
}

// ── Renderers ────────────────────────────────────────────────────────

const renderers = {};

renderers['overview'] = function(d) {
  const score0 = d.score ? (d.score.team_0 ?? '?') : '?';
  const score1 = d.score ? (d.score.team_1 ?? '?') : '?';
  let badges = '';
  if (d.forfeit) badges += ' <span class="badge badge-red">Forfeit</span>';

  let teamsRow = '';
  if (d.unfair_team_size && d.unfair_team_size > 0) {
    teamsRow = `<span class="label">Teams</span><span class="value" style="color:var(--muted);font-weight:400">Uneven (player left)</span>`;
  }

  return `<div class="card"><h3>Match Overview</h3>
    <div class="score-display" style="margin-bottom:16px">
      <span class="blue">${esc(String(score0))}</span>
      <span class="sep">—</span>
      <span class="orange">${esc(String(score1))}</span>
      ${badges}
    </div>
    <div class="kv-grid">
      <span class="label">Game Type</span><span class="value">${esc(d.game_type || '—')}</span>
      <span class="label">Team Size</span><span class="value">${esc(d.team_size || '—')}</span>
      <span class="label">Date</span><span class="value">${esc(d.date || '—')}</span>
      <span class="label">Duration</span><span class="value">${fmtDuration(d.duration_seconds)}</span>
      ${teamsRow}
    </div>
  </div>`;
};

renderers['players'] = function(d) {
  function renderTeam(players, idx) {
    const rows = (players || []).map(p => {
      const botCls = p.is_bot ? 'is-bot' : 'human';
      return `<div class="player-row">
        <span class="bot-dot ${botCls}" title="${p.is_bot ? 'Bot' : 'Human'}"></span>
        <span>${esc(p.name)}</span>
        <span class="platform">${esc(p.platform || '?')}</span>
      </div>`;
    }).join('');
    return `<div class="team-panel ${teamClass(idx)}"><h4>${teamName(idx)}</h4>${rows}</div>`;
  }
  return `<div class="card"><h3>Players</h3>
    <div class="team-panels">${renderTeam(d.team_0, 0)}${renderTeam(d.team_1, 1)}</div>
  </div>`;
};

renderers['stats'] = function(d) {
  const cols = [
    { label: 'Name' },
    { label: 'Score', num: true },
    { label: 'Goals', num: true },
    { label: 'Assists', num: true },
    { label: 'Saves', num: true },
    { label: 'Shots', num: true },
  ];

  function renderTeamTable(players, idx) {
    // Find best in each stat column
    const stats = ['score','goals','assists','saves','shots'];
    const bests = {};
    stats.forEach(s => {
      const max = Math.max(...(players || []).map(p => p[s] || 0));
      bests[s] = max;
    });

    const rows = (players || []).map(p => {
      const cells = stats.map(s => {
        const v = p[s] ?? 0;
        const cls = v > 0 && v === bests[s] ? ' class="num stat-best"' : ' class="num"';
        return `<td${cls}>${fmtInt(v)}</td>`;
      }).join('');
      return `<tr><td>${esc(p.name)}</td>${cells}</tr>`;
    }).join('');

    return `<div class="team-panel ${teamClass(idx)}"><h4>${teamName(idx)}</h4>
      <table class="data-table">${tableHeader(cols)}
      <tbody>${rows}</tbody></table></div>`;
  }

  return `<div class="card"><h3>Scoreboard</h3>
    <div class="team-panels">${renderTeamTable(d.team_0, 0)}${renderTeamTable(d.team_1, 1)}</div>
  </div>`;
};

renderers['rotation'] = function(d) {
  const playerCols = [
    { label: 'Name' },
    { label: 'Ball Chase%', num: true },
    { label: 'Near Ball%', num: true },
    { label: 'Offensive%', num: true },
    { label: 'Defensive%', num: true },
    { label: 'Back Post%', num: true },
    { label: 'Retreats', num: true },
  ];

  const teams = (d.teams || []).map(t => {
    const pRows = (t.players || []).map(p => {
      return `<tr>
        <td>${esc(p.name)}</td>
        <td class="num">${fmtNum(p.ball_chase_pct)}%</td>
        <td class="num">${fmtNum(p.time_near_ball_pct)}%</td>

        <td class="num">${fmtNum(p.back_post_rotation_pct)}%</td>
        <td class="num">${fmtInt(p.defensive_retreats)}</td>
      </tr>`;
    }).join('');

    const dc = t.double_commits || { count: 0, events: [] };
    let dcHtml = '';
    if (dc.count > 0) {
      const evts = (dc.events || []).slice(0, 10).map(e =>
        `<div class="double-commit-event">
          <span><span class="dc-label">Time:</span> ${fmtDuration(e.time)}</span>
          <span><span class="dc-label">Players:</span> ${(e.players || []).map(esc).join(', ')}</span>
          <span><span class="dc-label">Ball Dist:</span> ${fmtNum(e.distance_from_ball, 0)}</span>
        </div>`
      ).join('');
      dcHtml = `<div style="margin-top:12px"><strong style="color:var(--warn)">${dc.count} Double Commits</strong>${evts}</div>`;
    }

    const teamIdx = t.team_index ?? 0;
    return `<div class="card">
      <h3 style="color:${teamIdx === 0 ? '#4a9eff' : '#ff8c42'}">${esc(t.team_name || teamName(teamIdx))}</h3>
      <div style="margin-bottom:12px;font-size:14px">
        <span style="color:var(--muted)">Avg Teammate Distance:</span> <strong>${fmtNum(t.avg_teammate_distance, 0)}</strong>
      </div>
      <div style="overflow-x:auto"><table class="data-table">${tableHeader(playerCols)}
      <tbody>${pRows}</tbody></table></div>
      ${dcHtml}
    </div>`;
  }).join('');

  return teams;
};

renderers['verify'] = function(d) {
  function statusRow(label, valid) {
    const icon = valid ? '<span style="color:var(--success)">&#10003;</span>' : '<span style="color:var(--accent)">&#10007;</span>';
    const badge = valid ? '<span class="badge badge-green">Valid</span>' : '<span class="badge badge-red">Failed</span>';
    return `<div class="status-row">${icon} <span>${esc(label)}</span> ${badge}</div>`;
  }

  let tampered = '';
  if (d.tampered_section) {
    tampered = `<div style="margin-top:8px;padding:8px 12px;background:rgba(233,69,96,0.1);border-radius:6px;font-size:13px">
      <strong style="color:var(--accent)">Tampered Section:</strong> ${esc(d.tampered_section)}
    </div>`;
  }

  return `<div class="card"><h3>Verification Result</h3>
    <div style="margin-bottom:8px;font-size:13px;color:var(--muted)">Algorithm: <strong style="color:var(--text)">${esc(d.algorithm || '—')}</strong></div>
    ${statusRow('ED25519 Signature', d.ed25519_valid)}
    ${statusRow('ML-DSA-65 Signature', d.mldsa65_valid)}
    ${statusRow('Data Integrity', d.integrity_valid)}
    ${tampered}
  </div>`;
};

// ── Upload ────────────────────────────────────────────────────────────

document.getElementById('upload-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = e.target.querySelector('input[type="file"]');
  if (!input.files.length) return;

  const form = new FormData();
  form.append('replay', input.files[0]);

  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Uploading and parsing...</div>';

  try {
    const res = await fetch(`${API}/replays/upload`, { method: 'POST', body: form });
    const data = await res.json();

    if (!res.ok) {
      content.innerHTML = `<div class="error">Upload error: ${data.error || res.statusText}</div>`;
      return;
    }

    const overviewHtml = data.overview && renderers['overview'] ? renderers['overview'](data.overview) : `<pre>${JSON.stringify(data, null, 2)}</pre>`;
    content.innerHTML = `<div class="card"><h3>Upload Complete</h3><span class="badge badge-green">Parsed</span> <strong>${esc(data.name || '')}</strong></div>${overviewHtml}`;
    input.value = '';
    await loadReplays();
    selectReplay(data.category, data.name);
  } catch (e) {
    content.innerHTML = `<div class="error">Upload failed: ${e.message}</div>`;
  }
});

loadReplays();
